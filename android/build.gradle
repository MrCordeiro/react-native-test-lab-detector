apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
// Runs codegen on src/NativeTestLabDetector.ts and generates NativeTestLabDetectorSpec.
apply plugin: 'com.facebook.react'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace 'io.github.mrcordeiro.testlabdetector'
  compileSdk safeExtGet('compileSdkVersion', 36)
  defaultConfig {
    minSdk safeExtGet('minSdkVersion', 24)
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  testImplementation 'junit:junit:4.13.2'
}
