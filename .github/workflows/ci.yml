name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          CI: true

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Kotlin 2.1.0 does not run on Java 25, the runner default.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: bash scripts/test-kotlin.sh
